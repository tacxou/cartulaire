id: sceau
name: Sceau
description: Éditorial — papier, encre et rouge de cire, grande serif et grille visible
version: "1.0.0"
author: Cartulaire

branding:
  appName: Cartulaire
  logo: /assets/logo.png
  backgroundImage: ""
  backgroundColor: "#f2efe8"
  backgroundColorOpacity: 0

variables:
  font-family: '"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'
  font-index-family: '"Space Grotesk", sans-serif'
  font-google-url: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"

  color-primary: "#c8442c"
  color-primary-hover: "#a83a25"
  color-primary-glow: "rgba(200, 68, 44, 0.25)"
  color-primary-soft: "#c8442c"
  color-primary-soft-hover: "#a83a25"

  color-bg-body: "#f2efe8"
  color-bg-page: "#f2efe8"
  color-text-page: "#16151a"

  glass-edge: "#16151a"
  glass-inset: "rgba(255, 255, 255, 0)"
  glass-shadow: "0 24px 48px rgba(22, 21, 26, 0.14)"
  glass-shell-bg: "#faf8f2"
  glass-tint-gradient: "linear-gradient(165deg, #1d1c23 0%, #16151a 100%)"
  glass-inner-bg: "#faf8f2"
  glass-field-bg: "transparent"
  glass-field-border: "rgba(22, 21, 26, 0.35)"
  glass-field-focus-border: "#c8442c"
  glass-field-focus-ring: "rgba(200, 68, 44, 0.15)"

  color-badge-bg: "rgba(200, 68, 44, 0.1)"
  color-badge-text: "#a83a25"
  color-badge-border: "rgba(200, 68, 44, 0.3)"
  color-badge-subtle-bg: "rgba(22, 21, 26, 0.06)"
  color-badge-subtle-text: "#5c5952"
  color-badge-subtle-border: "rgba(22, 21, 26, 0.18)"

  index-orb-1: "#e8e2d4"
  index-orb-2: "#efe9db"
  index-orb-3: "#ded6c2"
  index-grid-color: "rgba(22, 21, 26, 0.06)"
  index-gradient-text: "linear-gradient(120deg, #16151a 30%, #c8442c)"
  index-accent: "#c8442c"
  index-accent-dark: "#a83a25"
  index-card-hover-border: "rgba(22, 21, 26, 0.4)"
  index-card-hover-bg: "#faf8f2"
