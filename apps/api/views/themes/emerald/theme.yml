id: emerald
name: Emerald
description: Verdure — carte parchemin, typographie classique, formes organiques
version: "1.1.0"
author: Cartulaire

variables:
  font-family: '"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'
  font-index-family: '"Cormorant Garamond", Georgia, serif'
  font-google-url: "https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"

  color-primary: "#2d6a4f"
  color-primary-hover: "#1b4332"
  color-primary-glow: "rgba(45, 106, 79, 0.35)"
  color-primary-soft: "#40916c"
  color-primary-soft-hover: "#52b788"

  color-bg-body: "#1a2e1f"
  color-bg-page: "#142218"
  color-text-page: "#d8f3dc"

  glass-edge: "rgba(82, 183, 136, 0.2)"
  glass-inset: "rgba(255, 255, 255, 0.04)"
  glass-shadow: "0 20px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(82, 183, 136, 0.12)"
  glass-shell-bg: "#f8f5f0"
  glass-tint-gradient: "linear-gradient(160deg, rgba(82, 183, 136, 0.08) 0%, rgba(248, 245, 240, 0.95) 100%)"
  glass-inner-bg: "#faf8f4"
  glass-field-bg: "#ffffff"
  glass-field-border: "rgba(45, 106, 79, 0.22)"
  glass-field-focus-border: "rgba(45, 106, 79, 0.55)"
  glass-field-focus-ring: "rgba(45, 106, 79, 0.15)"

  color-badge-bg: "rgba(45, 106, 79, 0.12)"
  color-badge-text: "#2d6a4f"
  color-badge-border: "rgba(45, 106, 79, 0.25)"
  color-badge-subtle-bg: "rgba(82, 183, 136, 0.1)"
  color-badge-subtle-text: "#40916c"
  color-badge-subtle-border: "rgba(82, 183, 136, 0.22)"

  index-orb-1: "#1b4332"
  index-orb-2: "#2d6a4f"
  index-orb-3: "#40916c"
  index-grid-color: "rgba(82, 183, 136, 0.06)"
  index-gradient-text: "linear-gradient(130deg, #95d5b2 10%, #2d6a4f 60%, #1b4332)"
  index-accent: "#2d6a4f"
  index-accent-dark: "#1b4332"
  index-card-hover-border: "rgba(45, 106, 79, 0.35)"
  index-card-hover-bg: "rgba(45, 106, 79, 0.06)"
