id: ardoise
name: Ardoise
description: Corporate plat — clair, violet désaturé, densité et lisibilité
version: "1.0.0"
author: Cartulaire

branding:
  appName: Cartulaire
  logo: /assets/logo.png
  backgroundImage: ""
  backgroundColor: "#f2f2f6"
  backgroundColorOpacity: 0

variables:
  font-family: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif'
  font-index-family: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif'
  font-google-url: ""

  color-primary: "#4a4585"
  color-primary-hover: "#3c3870"
  color-primary-glow: "rgba(74, 69, 133, 0.22)"
  color-primary-soft: "#4a4585"
  color-primary-soft-hover: "#322e63"

  color-bg-body: "#f2f2f6"
  color-bg-page: "#f8f8fa"
  color-text-page: "#141320"

  glass-edge: "#e0e0ea"
  glass-inset: "rgba(255, 255, 255, 0)"
  glass-shadow: "0 1px 2px rgba(20, 19, 32, 0.05), 0 12px 32px rgba(20, 19, 32, 0.07)"
  glass-shell-bg: "#ffffff"
  glass-tint-gradient: "linear-gradient(165deg, #f7f7fa 0%, #eeedf4 100%)"
  glass-inner-bg: "#ffffff"
  glass-field-bg: "#ffffff"
  glass-field-border: "#d4d4e0"
  glass-field-focus-border: "#4a4585"
  glass-field-focus-ring: "rgba(74, 69, 133, 0.18)"

  color-badge-bg: "#edecf6"
  color-badge-text: "#4a4585"
  color-badge-border: "#dcdaec"
  color-badge-subtle-bg: "#f4f3f9"
  color-badge-subtle-text: "#5e5990"
  color-badge-subtle-border: "#e6e4f2"

  index-orb-1: "#e6e4f2"
  index-orb-2: "#efeef6"
  index-orb-3: "#dcdaec"
  index-grid-color: "rgba(20, 19, 32, 0.035)"
  index-gradient-text: "linear-gradient(130deg, #4a4585, #141320)"
  index-accent: "#4a4585"
  index-accent-dark: "#37336b"
  index-card-hover-border: "#c6c4d4"
  index-card-hover-bg: "#fbfbfd"
