id: midnight
name: Midnight
description: Bleu ardoise profond, accents cyan — surcharge HTML/CSS/JS d'exemple
version: "1.0.0"
author: Cartulaire

variables:
  font-family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif'

  color-primary: "#0ea5e9"
  color-primary-hover: "#0284c7"
  color-primary-glow: "rgba(14, 165, 233, 0.4)"
  color-primary-soft: "#7dd3fc"
  color-primary-soft-hover: "#bae6fd"

  color-bg-body: "#020617"
  color-bg-page: "#01040f"
  color-text-page: "#e0f2fe"

  glass-edge: "rgba(148, 163, 184, 0.14)"
  glass-inset: "rgba(255, 255, 255, 0.05)"
  glass-shadow: "0 24px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(148, 163, 184, 0.1) inset"
  glass-shell-bg: "rgba(15, 23, 42, 0.78)"
  glass-tint-gradient: "linear-gradient(160deg, rgba(14, 165, 233, 0.14) 0%, rgba(15, 23, 42, 0.4) 50%, rgba(2, 6, 23, 0.55) 100%)"
  glass-inner-bg: "rgba(255, 255, 255, 0.025)"
  glass-field-bg: "rgba(255, 255, 255, 0.05)"
  glass-field-border: "rgba(148, 163, 184, 0.18)"
  glass-field-focus-border: "rgba(14, 165, 233, 0.55)"
  glass-field-focus-ring: "rgba(14, 165, 233, 0.22)"

  color-badge-bg: "rgba(14, 165, 233, 0.18)"
  color-badge-text: "#7dd3fc"
  color-badge-border: "rgba(14, 165, 233, 0.35)"
  color-badge-subtle-bg: "rgba(14, 165, 233, 0.12)"
  color-badge-subtle-text: "#bae6fd"
  color-badge-subtle-border: "rgba(14, 165, 233, 0.28)"

  index-orb-1: "#0c4a6e"
  index-orb-2: "#082f49"
  index-orb-3: "#164e63"
  index-grid-color: "rgba(14, 165, 233, 0.06)"
  index-gradient-text: "linear-gradient(130deg, #7dd3fc 10%, #0ea5e9 60%, #0369a1)"
  index-accent: "#0ea5e9"
  index-accent-dark: "#0369a1"
  index-card-hover-border: "rgba(14, 165, 233, 0.38)"
  index-card-hover-bg: "rgba(14, 165, 233, 0.08)"
