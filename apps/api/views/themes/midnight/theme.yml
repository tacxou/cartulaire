id: midnight
name: Midnight
description: Terminal CRT — invite de commande, scanlines, phosphore cyan
version: "1.1.0"
author: Cartulaire

variables:
  font-family: '"JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, monospace'
  font-index-family: '"JetBrains Mono", ui-monospace, monospace'
  font-google-url: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"

  color-primary: "#22d3ee"
  color-primary-hover: "#06b6d4"
  color-primary-glow: "rgba(34, 211, 238, 0.45)"
  color-primary-soft: "#67e8f9"
  color-primary-soft-hover: "#a5f3fc"

  color-bg-body: "#000000"
  color-bg-page: "#000000"
  color-text-page: "#a5f3fc"

  glass-edge: "rgba(34, 211, 238, 0.25)"
  glass-inset: "rgba(34, 211, 238, 0.04)"
  glass-shadow: "0 0 40px rgba(34, 211, 238, 0.12), 0 24px 48px rgba(0, 0, 0, 0.8)"
  glass-shell-bg: "#0a0a0a"
  glass-tint-gradient: "linear-gradient(180deg, rgba(34, 211, 238, 0.06) 0%, rgba(10, 10, 10, 0.95) 100%)"
  glass-inner-bg: "#050505"
  glass-field-bg: "#000000"
  glass-field-border: "rgba(34, 211, 238, 0.35)"
  glass-field-focus-border: "rgba(34, 211, 238, 0.7)"
  glass-field-focus-ring: "rgba(34, 211, 238, 0.2)"

  color-badge-bg: "rgba(34, 211, 238, 0.12)"
  color-badge-text: "#67e8f9"
  color-badge-border: "rgba(34, 211, 238, 0.35)"
  color-badge-subtle-bg: "rgba(34, 211, 238, 0.08)"
  color-badge-subtle-text: "#a5f3fc"
  color-badge-subtle-border: "rgba(34, 211, 238, 0.25)"

  index-orb-1: "#083344"
  index-orb-2: "#042f2e"
  index-orb-3: "#0c4a6e"
  index-grid-color: "rgba(34, 211, 238, 0.04)"
  index-gradient-text: "linear-gradient(130deg, #a5f3fc 10%, #22d3ee 60%, #0891b2)"
  index-accent: "#22d3ee"
  index-accent-dark: "#0891b2"
  index-card-hover-border: "rgba(34, 211, 238, 0.4)"
  index-card-hover-bg: "rgba(34, 211, 238, 0.06)"
