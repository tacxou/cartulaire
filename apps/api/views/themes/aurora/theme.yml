id: aurora
name: Aurora
description: Aurore boréale — bandeaux lumineux animés, mise en page verticale
version: "1.1.0"
author: Cartulaire

branding:
  appName: Cartulaire
  logo: /assets/logo.png
  backgroundImage: /assets/background.svg
  backgroundColor: "#0c0a1a"
  backgroundColorOpacity: 0.84

variables:
  font-family: '"Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'
  font-index-family: '"Outfit", sans-serif'
  font-google-url: "https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"

  color-primary: "#22d3ee"
  color-primary-hover: "#06b6d4"
  color-primary-glow: "rgba(34, 211, 238, 0.5)"
  color-primary-soft: "#a5f3fc"
  color-primary-soft-hover: "#cffafe"

  color-bg-body: "#0c0a1a"
  color-bg-page: "#080612"
  color-text-page: "#e0f7fa"

  glass-edge: "rgba(165, 243, 252, 0.15)"
  glass-inset: "rgba(255, 255, 255, 0.06)"
  glass-shadow: "0 32px 64px rgba(0, 0, 0, 0.55), 0 0 80px rgba(34, 211, 238, 0.08)"
  glass-shell-bg: "rgba(12, 10, 26, 0.82)"
  glass-tint-gradient: "linear-gradient(180deg, rgba(34, 211, 238, 0.18) 0%, rgba(168, 85, 247, 0.12) 40%, rgba(12, 10, 26, 0.6) 100%)"
  glass-inner-bg: "rgba(255, 255, 255, 0.02)"
  glass-field-bg: "rgba(255, 255, 255, 0.05)"
  glass-field-border: "rgba(165, 243, 252, 0.18)"
  glass-field-focus-border: "rgba(34, 211, 238, 0.6)"
  glass-field-focus-ring: "rgba(34, 211, 238, 0.25)"

  color-badge-bg: "rgba(34, 211, 238, 0.15)"
  color-badge-text: "#a5f3fc"
  color-badge-border: "rgba(34, 211, 238, 0.35)"
  color-badge-subtle-bg: "rgba(168, 85, 247, 0.12)"
  color-badge-subtle-text: "#d8b4fe"
  color-badge-subtle-border: "rgba(168, 85, 247, 0.28)"

  index-orb-1: "#164e63"
  index-orb-2: "#581c87"
  index-orb-3: "#0e7490"
  index-grid-color: "rgba(34, 211, 238, 0.04)"
  index-gradient-text: "linear-gradient(120deg, #a5f3fc 0%, #22d3ee 35%, #c084fc 70%, #e879f9 100%)"
  index-accent: "#22d3ee"
  index-accent-dark: "#0891b2"
  index-card-hover-border: "rgba(34, 211, 238, 0.4)"
  index-card-hover-bg: "rgba(34, 211, 238, 0.06)"
